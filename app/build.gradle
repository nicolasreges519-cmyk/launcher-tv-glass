plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meulauncher.glass'
    compileSdk 34

    defaultConfig {
        applicationId 'com.meulauncher.glass'
        minSdk 26
        targetSdk 31
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'TMDB_TOKEN', "\"${System.getenv('TMDB_TOKEN') ?: ''}\""
        buildConfigField 'String', 'YOUTUBE_KEY', "\"${System.getenv('YOUTUBE_KEY') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
